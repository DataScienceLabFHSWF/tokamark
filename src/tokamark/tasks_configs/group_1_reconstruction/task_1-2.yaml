task_name: task_1-2
task_type: markovian

sources_and_signals:
  input_name: &input_keys
    - [magnetics, flux_loop_flux] 
    - [magnetics, b_field_pol_probe_ccbv_field]
    - [magnetics, b_field_pol_probe_obr_field]
    - [magnetics, b_field_pol_probe_obv_field]
    - [magnetics, b_field_tor_probe_saddle_voltage]
    - [pf_active, coil_current]
    - [pf_active, solenoid_current]
    - [summary, ip]

  actuator_name: &actuator_keys null 

  output_name: &output_keys
    - [equilibrium, lcfs_r]
    - [equilibrium, lcfs_z]

task_window_segmenter:
  input_keys: *input_keys
  actuator_keys: *actuator_keys
  output_keys: *output_keys
  input_length: 0.005
  output_length: 0.005
  delta: -0.005  # This is reconstruction, i.e., -delta = input_length = output_length

stride_window: 0.001