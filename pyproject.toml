[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmast-data-preprocessing"
version = "0.1.0"
description = "Data preprocessing and baseline models for FAIRMAST"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
  "zarr==3.0.2",
  "fsspec==2025.3.0",
  "s3fs==2025.3.0",
  "xarray",
  "matplotlib",
  "notebook",
  "opencv-python",
  "tqdm",
  "ipywidgets",
  "black",
  "pyarrow",
  "rich",
  "torch",
  "torchvision",
  "numpy",
  "scikit-learn",
  "tensordict",
  "tensorboard",
  "optuna",
  "seaborn",
  "imageio",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ensure non-code data inside the benchmark package is included in wheels
[tool.setuptools.package-data]
MAST_benchmark = [
    "metadata/**",
    "task_configs/**",
]

# Turn on include-package-data for good measure (honors MANIFEST.in rules)
[tool.setuptools]
include-package-data = true
